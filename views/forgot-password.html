
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu</title>
  <link rel="stylesheet" href="\css\loggin_style.css">
  <script src="auth.js" defer></script>
</head>
<body>
<main class="auth-card">
  <h1>Quên mật khẩu?</h1>

  <p class="description">
    Nhập email bạn đã đăng ký. Chúng tôi sẽ gửi
    liên kết để bạn tạo mật khẩu mới.
  </p>

  <form id="forgotForm">
    <label for="email">Địa chỉ email</label>
    <input
      id="email"
      name="email"
      type="email"
      maxlength="255"
      autocomplete="email"
      required
    >

    <button type="submit">Gửi liên kết</button>

    <p id="message" class="message"
       role="status" aria-live="polite"></p>
  </form>

  <p class="footer-link">
    <a href="register.html">Quay lại đăng ký</a>
  </p>
</main>
</body>
</html>

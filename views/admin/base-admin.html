<!DOCTYPE html>
<html lang="vi" class="h-full bg-[#f8fafc]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}EventDecor Admin{% endblock %}</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body class="h-full m-0 p-0 bg-[#f8fafc] overflow-hidden flex">

  <!-- 1. SIDEBAR (Chỉ định rõ trong thư mục admin/) -->
  {% include "admin/sidebar-admin.html" %}

  <!-- 2. NỘI DUNG CHÍNH -->
  <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
    {% include "admin/header-admin.html" %}

    <main class="flex-1 overflow-y-auto p-6 bg-[#f8fafc]">
      {% block content %}{% endblock %}
    </main>
  </div>

  {% block scripts %}{% endblock %}
</body>
</html>

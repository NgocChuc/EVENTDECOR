<script>
  // Đóng mở submenu
  document.getElementById('btn-account-toggle')?.addEventListener('click', () => {
    document.getElementById('account-submenu')?.classList.toggle('hidden');
    document.getElementById('account-arrow')?.classList.toggle('rotate-90');
  });

  document.getElementById('btn-service-toggle')?.addEventListener('click', () => {
    document.getElementById('service-submenu')?.classList.toggle('hidden');
    document.getElementById('service-arrow')?.classList.toggle('rotate-90');
  });

  // Tự động active menu thông minh (Khớp cả khi URL có hoặc không có đuôi .html)
  (function() {
    const curPath = window.location.pathname.replace(/\/$/, ""); // Loại bỏ slash cuối nếu có
    const normalize = path => path.replace(/\.html$/, "");

    document.querySelectorAll('.nav-link').forEach(link => {
      const href = link.getAttribute('href');
      if (!href) return;

      const normHref = normalize(href);
      const normCur = normalize(curPath);

      if (normCur === normHref || (normCur === '/admin' && normHref === '/admin/dashboard')) {
        link.classList.add('bg-[#15223c]', 'text-white');
        link.classList.remove('text-[#94a3b8]');
        
        // Mở submenu cha nếu menu này nằm bên trong
        const sub = link.closest('#account-submenu, #service-submenu');
        if (sub) {
          sub.classList.remove('hidden');
          const toggleBtn = sub.previousElementSibling;
          toggleBtn?.querySelector('.material-symbols-outlined:last-child')?.classList.add('rotate-90');
        }
      }
    });
  })();
</script>

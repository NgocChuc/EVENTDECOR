<!DOCTYPE html>
<html lang="vi" class="h-full scroll-smooth bg-[#fff7eb]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}EventDecor{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .light-frosted-card {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(174, 196, 212, 0.45);
    }
    .frosted-pill {
      background: rgba(249, 240, 224, 0.8);
      border: 1px solid rgba(174, 196, 212, 0.5);
    }
  </style>
</head>
<body class="min-h-full flex flex-col text-slate-800 bg-[#fff7eb]">

  <!-- HEADER CỐ ĐỊNH CHUẨN TOÀN CỤC -->
  {% include "header.html" %}

  <!-- VÙNG NỘI DUNG TỪ CÁC TRANG CON -->
  <div class="flex-1 flex flex-col">
    {% block content %}{% endblock %}
  </div>

  <script src="/js/admin/breadcrumb.js"></script>
</body>
</html>
